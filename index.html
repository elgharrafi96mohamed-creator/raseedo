<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Raseedo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#5351EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raseedo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* ======================================================================
   رصيدو — Raseedo
   كل مبلغ، واضح. / Her tutar, net. / Every amount, clear.
   ====================================================================== */

:root{
  --primary:#5351EB;      --primary-strong:#4340D8;  --primary-soft:#EEEEFD;
  --apricot:#FFBF91;      --apricot-soft:#FFF1E6;    --apricot-ink:#8A4E1E;
  --text:#22243E;         --muted:#74758B;           --faint:#9A9BB4;
  --bg:#F6F6FC;           --surface:#FFFFFF;         --surface-sunk:#F1F1F9;
  --border:#E6E6F2;       --border-strong:#D6D6E8;
  --income:#24775C;       --income-soft:#E6F2ED;
  --expense:#BA455B;      --expense-soft:#FBE9EC;
  --transfer:#5351EB;     --transfer-soft:#EEEEFD;
  --warn:#B4761F;         --warn-soft:#FDF2E0;
  --shadow-card:0 1px 2px rgba(34,36,62,.05), 0 8px 24px rgba(34,36,62,.06);
  --shadow-pop:0 6px 14px rgba(34,36,62,.10), 0 24px 56px rgba(34,36,62,.16);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --tab-h:60px;
  --ff-ar:"IBM Plex Sans Arabic","Geeza Pro","SF Arabic",system-ui,sans-serif;
  --ff-lat:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --ff:var(--ff-lat);
  color-scheme:light;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --primary:#8785FF; --primary-strong:#A3A1FF; --primary-soft:#242652;
  --apricot:#FFBF91; --apricot-soft:#3A2A1E; --apricot-ink:#FFD9BC;
  --text:#EEEEF6; --muted:#9A9BB4; --faint:#7B7C95;
  --bg:#101223; --surface:#191B30; --surface-sunk:#141629;
  --border:#2C2F4C; --border-strong:#3A3D5E;
  --income:#5CC79F; --income-soft:#16311F;
  --expense:#F1798E; --expense-soft:#3A1A24;
  --transfer:#8785FF; --transfer-soft:#242652;
  --warn:#E8B45F; --warn-soft:#3A2E17;
  --shadow-card:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.36);
  --shadow-pop:0 6px 14px rgba(0,0,0,.40), 0 24px 56px rgba(0,0,0,.52);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#8785FF; --primary-strong:#A3A1FF; --primary-soft:#242652;
  --apricot:#FFBF91; --apricot-soft:#3A2A1E; --apricot-ink:#FFD9BC;
  --text:#EEEEF6; --muted:#9A9BB4; --faint:#7B7C95;
  --bg:#101223; --surface:#191B30; --surface-sunk:#141629;
  --border:#2C2F4C; --border-strong:#3A3D5E;
  --income:#5CC79F; --income-soft:#16311F;
  --expense:#F1798E; --expense-soft:#3A1A24;
  --transfer:#8785FF; --transfer-soft:#242652;
  --warn:#E8B45F; --warn-soft:#3A2E17;
  --shadow-card:0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.36);
  --shadow-pop:0 6px 14px rgba(0,0,0,.40), 0 24px 56px rgba(0,0,0,.52);
  color-scheme:dark;
}
html[lang="ar"]{ --ff:var(--ff-ar); }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ff); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,h4{ margin:0; text-wrap:balance; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }
a{ color:var(--primary); }
:focus-visible{ outline:3px solid var(--primary); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }

/* ---------- الأرقام: لا تُقص ولا تُختصر ---------- */
.amt{
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  white-space:nowrap; direction:ltr; unicode-bidi:isolate; font-weight:700;
  overflow-wrap:normal; text-overflow:clip;
}
.amt--in{ color:var(--income); } .amt--out{ color:var(--expense); } .amt--tr{ color:var(--transfer); }
.amt-xl{ font-size:clamp(26px,8vw,34px); letter-spacing:-.02em; }
.amt-lg{ font-size:20px; } .amt-sm{ font-size:14px; }

/* ---------- الهيكل ---------- */
#app{ display:flex; flex-direction:column; min-height:100%; }
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:10px 16px;
}
.brand{ display:flex; align-items:center; gap:9px; min-width:0; }
.brand svg{ width:28px; height:28px; border-radius:8px; flex:none; }
.brand b{ font-size:16px; font-weight:800; letter-spacing:-.01em; }
.brand small{ display:block; font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.01em; }
.topbar .spacer{ flex:1; }
.iconbtn{
  width:38px; height:38px; border-radius:var(--r-pill); display:grid; place-items:center;
  color:var(--muted); border:1px solid transparent;
}
.iconbtn:hover{ background:var(--surface-sunk); color:var(--text); }
.iconbtn svg{ width:19px; height:19px; }

main{ flex:1; padding:14px 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 22px); }
.view{ display:flex; flex-direction:column; gap:14px; max-width:720px; margin-inline:auto; }

/* ---------- شريط التبويبات ---------- */
.tabbar{
  position:fixed; inset-inline:0; bottom:0; z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--border);
  padding:0 6px env(safe-area-inset-bottom,0px);
  display:grid; grid-template-columns:repeat(5,1fr);
}
.tabbar button{
  height:var(--tab-h); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:var(--muted); font-size:10.5px; font-weight:650; border-radius:var(--r-md);
}
.tabbar button svg{ width:21px; height:21px; }
.tabbar button[aria-current="page"]{ color:var(--primary); }
.tabbar button[data-add="1"]{ color:var(--primary); }
.tabbar button[data-add="1"] svg{
  background:var(--primary); color:#fff; width:30px; height:30px; padding:5px;
  border-radius:11px; box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 40%,transparent);
}
.tabbar button[aria-current="page"] .dot{
  width:4px; height:4px; border-radius:50%; background:var(--primary); margin-top:-1px;
}

/* ---------- كتلة الإجابات (الرئيسية) ---------- */
.answers{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl);
  box-shadow:var(--shadow-card); overflow:hidden;
}
.answers .lead{ padding:18px 18px 14px; }
.answers .lead .k{ font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em; }
.answers .lead .sub{ font-size:12.5px; color:var(--faint); margin-top:5px; }
.answers .grid{ display:grid; grid-template-columns:1fr; border-top:1px solid var(--border); }
.answers .grid > div{
  padding:11px 18px; border-top:1px solid var(--border);
  display:flex; align-items:baseline; gap:12px;
}
.answers .grid > div:first-child{ border-top:0; }
.answers .grid .k{ font-size:12.5px; color:var(--muted); font-weight:650; flex:1; min-width:0; }
.answers .grid .v{ font-size:17px; text-align:end; }
@media (min-width:480px){
  .answers .grid{ grid-template-columns:repeat(3,1fr); }
  .answers .grid > div{
    display:block; padding:13px 14px 15px;
    border-top:0; border-inline-start:1px solid var(--border);
  }
  .answers .grid > div:first-child{ border-inline-start:0; }
  .answers .grid .k{ margin-bottom:5px; }
  .answers .grid .v{ text-align:start; }
}

/* ---------- عناوين الأقسام ---------- */
.sec{ display:flex; align-items:baseline; gap:8px; margin:4px 2px -4px; }
.sec h2{ font-size:14px; font-weight:750; letter-spacing:-.005em; }
.sec .more{ margin-inline-start:auto; font-size:12.5px; color:var(--primary); font-weight:650; }
.sec .hint{ font-size:12px; color:var(--faint); }

/* ---------- قوائم ---------- */
.list{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; }
.row{
  display:flex; align-items:center; gap:11px; padding:11px 13px; width:100%; text-align:start;
  border-bottom:1px solid var(--border); background:none;
}
.row:last-child{ border-bottom:0; }
.row:hover{ background:var(--surface-sunk); }
.row .ico{
  width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center;
  font-size:14px; font-weight:800; color:#fff;
}
.row .mid{ flex:1; min-width:0; }
.row .t{ font-size:14px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .s{ font-size:11.5px; color:var(--muted); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .end{ text-align:end; flex:none; }
.row .end .s{ margin-top:3px; }

/* ---------- قضبان الميزانية ---------- */
.rails{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:6px 14px 12px; }
.rail{ padding:10px 0; border-bottom:1px solid var(--border); }
.rail:last-child{ border-bottom:0; }
.rail .top{ display:flex; align-items:baseline; gap:8px; margin-bottom:7px; }
.rail .name{ font-size:13px; font-weight:650; }
.rail .nums{ margin-inline-start:auto; font-size:12px; color:var(--muted); }
.rail .track{ height:7px; border-radius:var(--r-pill); background:var(--surface-sunk); overflow:hidden; }
.rail .fill{ height:100%; border-radius:var(--r-pill); background:var(--primary); transition:width .35s ease; }
.rail[data-state="warn"] .fill{ background:var(--warn); }
.rail[data-state="over"] .fill{ background:var(--expense); }
.rail .note{ font-size:11.5px; margin-top:6px; color:var(--muted); }
.rail[data-state="over"] .note{ color:var(--expense); font-weight:600; }

/* ---------- الأشخاص ---------- */
.person{ display:flex; align-items:center; gap:12px; padding:12px 13px; border-bottom:1px solid var(--border); width:100%; text-align:start; }
.person:last-child{ border-bottom:0; }
.person:hover{ background:var(--surface-sunk); }
.avatar{
  width:40px; height:40px; border-radius:var(--r-pill); flex:none; display:grid; place-items:center;
  font-weight:800; font-size:15px; color:#fff; background:var(--primary);
}
.meter{ height:6px; border-radius:var(--r-pill); background:var(--surface-sunk); overflow:hidden; margin-top:7px; }
.meter i{ display:block; height:100%; background:var(--apricot); }

/* ---------- شارات ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; border-radius:var(--r-pill);
  padding:3px 9px; font-size:11.5px; font-weight:700; border:1px solid transparent; white-space:nowrap;
}
.chip--in{ background:var(--income-soft); color:var(--income); }
.chip--out{ background:var(--expense-soft); color:var(--expense); }
.chip--tr{ background:var(--transfer-soft); color:var(--transfer); }
.chip--guess{ background:var(--apricot-soft); color:var(--apricot-ink); }
.chip--warn{ background:var(--warn-soft); color:var(--warn); }
.chip--ghost{ background:var(--surface-sunk); color:var(--muted); }

/* ---------- أزرار ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:var(--r-md); padding:11px 16px; font-weight:700; font-size:14px;
  background:var(--surface-sunk); color:var(--text); border:1px solid var(--border);
}
.btn:hover{ border-color:var(--border-strong); }
.btn--primary{ background:var(--primary); color:#fff; border-color:transparent; }
.btn--primary:hover{ background:var(--primary-strong); }
.btn--danger{ color:var(--expense); }
.btn--wide{ width:100%; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btnrow{ display:flex; gap:9px; flex-wrap:wrap; }

.fab{
  position:fixed; inset-inline-end:18px;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);
  z-index:45; width:56px; height:56px; border-radius:20px; background:var(--primary); color:#fff;
  display:grid; place-items:center; box-shadow:var(--shadow-pop);
}
.fab svg{ width:25px; height:25px; }
.fab:hover{ background:var(--primary-strong); }

/* ---------- حقول ---------- */
.field{ display:flex; flex-direction:column; gap:6px; }
.field > label{ font-size:12.5px; font-weight:700; color:var(--muted); }
.ctl{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:11px 13px; font-size:15px; width:100%;
}
.ctl:focus{ border-color:var(--primary); }
select.ctl{ appearance:none; background-image:none; }
.keypad-amt{
  font-size:clamp(30px,10vw,40px); font-weight:800; text-align:center; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; direction:ltr;
}
.seg{ display:flex; background:var(--surface-sunk); border-radius:var(--r-md); padding:3px; gap:3px; }
.seg button{ flex:1; padding:9px 8px; border-radius:11px; font-size:13px; font-weight:700; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-card); }
.seg button[aria-pressed="true"][data-k="expense"]{ color:var(--expense); }
.seg button[aria-pressed="true"][data-k="income"]{ color:var(--income); }
.seg button[aria-pressed="true"][data-k="transfer"]{ color:var(--transfer); }
.pills{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.pills::-webkit-scrollbar{ display:none; }
.pill{
  border:1px solid var(--border); background:var(--surface); border-radius:var(--r-pill);
  padding:7px 13px; font-size:13px; font-weight:650; white-space:nowrap; color:var(--muted);
}
.pill[aria-pressed="true"]{ background:var(--primary); color:#fff; border-color:transparent; }

/* ---------- ورقة منبثقة ---------- */
.sheet-back{
  position:fixed; inset:0; z-index:60; background:rgba(16,18,35,.45);
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  background:var(--surface); width:min(560px,100%); max-height:92dvh; overflow:auto;
  border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow-pop);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{ from{ transform:translateY(18px); opacity:.6 } to{ transform:none; opacity:1 } }
.sheet .grab{ width:38px; height:4px; border-radius:2px; background:var(--border-strong); margin:6px auto 12px; }
.sheet h3{ font-size:17px; font-weight:750; margin-bottom:3px; }
.sheet .sub{ font-size:12.5px; color:var(--muted); margin-bottom:14px; }
.sheet .body{ display:flex; flex-direction:column; gap:13px; }

/* ---------- حالات فارغة ---------- */
.empty{
  border:1px dashed var(--border-strong); border-radius:var(--r-lg); background:var(--surface);
  padding:26px 20px; text-align:center;
}
.empty h3{ font-size:15px; margin-bottom:5px; }
.empty p{ font-size:13px; color:var(--muted); margin:0 0 14px; }

/* ---------- جداول ومخططات ---------- */
.tablewrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:13px; }
th,td{ padding:8px 10px; text-align:start; border-bottom:1px solid var(--border); white-space:nowrap; }
th{ font-size:11.5px; color:var(--muted); font-weight:700; }
td.num,th.num{ text-align:end; font-variant-numeric:tabular-nums; direction:ltr; }

.bars{ display:flex; flex-direction:column; gap:9px; }
.bar{ display:grid; grid-template-columns:minmax(72px,29%) 1fr auto; gap:9px; align-items:center; }
.bar .nm{ font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .tr{ height:9px; border-radius:var(--r-pill); background:var(--surface-sunk); overflow:hidden; }
.bar .fl{ height:100%; border-radius:var(--r-pill); }
.bar .vl{ font-size:12px; }

.spark{ display:block; width:100%; height:64px; }

/* ---------- متفرقات ---------- */
.note{ font-size:12.5px; color:var(--muted); }
.warnbox{
  background:var(--warn-soft); border:1px solid color-mix(in srgb,var(--warn) 32%, transparent);
  color:var(--warn); border-radius:var(--r-md); padding:11px 13px; font-size:12.5px; font-weight:600;
}
.okbox{
  background:var(--income-soft); border:1px solid color-mix(in srgb,var(--income) 30%, transparent);
  color:var(--income); border-radius:var(--r-md); padding:11px 13px; font-size:12.5px; font-weight:600;
}
.toast{
  position:fixed; inset-inline:0; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 74px);
  z-index:70; display:flex; justify-content:center; pointer-events:none;
}
.toast > div{
  background:var(--text); color:var(--bg); border-radius:var(--r-pill); padding:9px 17px;
  font-size:13px; font-weight:650; box-shadow:var(--shadow-pop); max-width:calc(100% - 32px);
}
.kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
.kv dt{ color:var(--muted); }
.kv dd{ margin:0; text-align:end; font-variant-numeric:tabular-nums; }
.demo-ribbon{
  background:var(--apricot-soft); color:var(--apricot-ink); border:1px solid color-mix(in srgb,var(--apricot) 60%,transparent);
  border-radius:var(--r-md); padding:9px 13px; font-size:12.5px; font-weight:650;
  display:flex; align-items:center; gap:9px;
}
.demo-ribbon span{ flex:1; min-width:0; }
.demo-ribbon button{ flex:none; white-space:nowrap; color:inherit; font-weight:800;
  text-decoration:underline; font-size:12.5px; }

@media (min-width:560px){
  .answers .lead{ padding:22px 22px 16px; }
  main{ padding-inline:20px; }
}

</style>
</head>

      el('h3', { text:title }), el('p', { text:body }),
      cta ? el('button', { class:'btn btn--primary', text:cta, onclick:onCta }) : null
    ]);
  }
  function go(name, param){ route = { name, param:param||null }; render(); window.scrollTo(0,0); }

  /* ================= الرئيسية ================= */
  function viewHome(){
    const v = el('div', { class:'view' });
    if (S.db.demo){
      v.appendChild(el('div', { class:'demo-ribbon' }, [
        U.icon('alert', 16), el('span', { text:T('common.demoBanner') }),
        el('button', { text:T('common.demoReplace'), onclick:()=>go('io') })
      ]));
    }

    const [m0, m1] = S.monthRange();
    const have = S.netWorthBase();
    const spent = S.spentBetween(m0, m1);
    const left = S.budgetLeftTotal();
    const held = S.heldByOthersBase();

    const answers = el('div', { class:'answers' }, [
      el('div', { class:'lead' }, [
        el('div', { class:'k', text:T('home.haveTitle') }),
        U.moneyEl(have, base(), 'amt-xl'),
        el('div', { class:'sub', text:T('home.haveSub', { cur: U.symbolOf(base()) }) })
      ]),
      el('div', { class:'grid' }, [
        el('div', {}, [ el('div',{class:'k',text:T('home.spent')}), U.moneyEl(spent, base(), 'amt--out v') ]),
        el('div', {}, [ el('div',{class:'k',text:T('home.budgetLeft')}),
          left == null ? el('div', { class:'chip chip--ghost', text:T('home.noBudget') })
                       : U.moneyEl(left, base(), (left < 0 ? 'amt--out' : 'amt--in') + ' v') ]),
        el('div', {}, [ el('div',{class:'k',text:T('home.withOthers')}),
          U.moneyEl(held, base(), 'amt--tr v') ])
      ])
    ]);
    v.appendChild(answers);

    /* الميزانيات */
    if (S.db.budgets.length){
      v.appendChild(sectionHead(T('home.budgets'), T('home.seeAll'), ()=>go('budgets')));
      const rails = el('div', { class:'rails' });
      S.db.budgets.slice(0,4).forEach(b => {
        const st = S.budgetStatus(b);
        const nm = b.scope === 'all' ? T('common.total') : catLabel(b.targetId);
        const r = el('div', { class:'rail', 'data-state':st.state }, [
          el('div', { class:'top' }, [
            el('span', { class:'name', text:nm }),
            el('span', { class:'nums' }, [
              U.moneyEl(st.used, base(), 'amt-sm'),
              document.createTextNode(' ' + T('common.of') + ' '),
              U.moneyEl(st.limit, base(), 'amt-sm')
            ])
          ]),
          el('div', { class:'track' }, [ el('div', { class:'fill',
            style:{ width: Math.min(100, Math.round(st.pct*100)) + '%' } }) ]),
          el('div', { class:'note' }, [
            document.createTextNode(T('home.budgetLeft') + ': '),
            U.moneyEl(st.left, base(), 'amt-sm ' + (st.left < 0 ? 'amt--out' : ''))
          ])
        ]);
        rails.appendChild(r);
      });
      v.appendChild(rails);
    } else {
      v.appendChild(sectionHead(T('home.budgets')));
      v.appendChild(emptyBox(T('home.emptyBudgetTitle'), T('home.emptyBudgetBody'),
        T('home.emptyBudgetCta'), ()=>go('budgets')));
    }

    /* الأشخاص */
    const people = S.db.people.filter(p => !p.archived);
    v.appendChild(sectionHead(T('home.people'), T('home.seeAll'), ()=>go('people')));
    if (!people.length){
      v.appendChild(emptyBox(T('home.emptyPeopleTitle'), T('home.emptyPeopleBody'),
        T('home.emptyPeopleCta'), ()=>go('people')));
    } else {
      const list = el('div', { class:'list' });
      people.slice(0,4).forEach(p => list.appendChild(personRow(p)));
      v.appendChild(list);
    }

    /* آخر العمليات */
    v.appendChild(sectionHead(T('home.recent'), T('home.seeAll'), ()=>go('tx')));
    const recent = allEntries().slice(0, 6);
    if (!recent.length){
      v.appendChild(emptyBox(T('home.emptyTitle'), T('home.emptyBody'), T('home.emptyCta'), openAdd));
    } else {
      const list = el('div', { class:'list' });
      recent.forEach(e => list.appendChild(entryRow(e)));
      v.appendChild(list);
    }
    return v;
  }

  /* ================= العمليات ================= */
  function allEntries(){
    const tx = S.db.transactions.map(t => ({ kind:'tx', t }));
    const px = S.db.personTransactions.map(p => ({ kind:'person', t:p }));
    return tx.concat(px).sort((a,b) => Date.parse(b.t.occurredAt) - Date.parse(a.t.occurredAt));
  }
  function entryTone(t){
    if (t.type === 'income' || t.type === 'return' || t.type === 'borrow') return 'in';
    if (t.type === 'expense' || t.type === 'purchase' || t.type === 'repay') return 'out';
    return 'tr';
  }
  function entryTitle(e){
    const t = e.t;
    if (e.kind === 'person'){
      const p = perOf(t.personId);
      const who = p ? p.name : (t.personName || '');
      const verb = T('ledger.types.' + t.type) || t.type;
      return verb + ' · ' + who;
    }
    if (t.type === 'transfer'){
      const a = accOf(t.accountId), b = accOf(t.toAccountId);
      return T('add.transfer') + (a ? ' · ' + nameOf(a) : '') + (b ? ' → ' + nameOf(b) : '');
    }
    if (t.type === 'adjustment' || t.type === 'fee') return t.type === 'fee' ? 'Fee' : 'Adjustment';
    return catLabel(t.categoryId);
  }
  function entrySub(e){
    const t = e.t;
    const bits = [U.dateShort(t.occurredAt)];
    if (e.kind === 'tx' && t.accountId){ const a = accOf(t.accountId); if (a) bits.push(nameOf(a)); }
    const note = typeof t.note === 'string' ? t.note : S.localized(t.note, I.lang);
    if (note) bits.push(note);
    return bits.join(' · ');
  }
  function entryRow(e){
    const t = e.t, tone = entryTone(t);
    const c = e.kind === 'tx' ? catOf(t.categoryId) : null;
    const color = (c && c.color) || U.colorFor(entryTitle(e));
    const row = el('button', { class:'row', onclick:()=>openEntry(e) }, [
      el('div', { class:'ico', style:{ background:color } },
        [ e.kind === 'person' ? U.icon(t.type==='purchase' ? 'bag' : 'hand', 17)
                              : U.icon(t.type==='transfer' ? 'wallet' : 'tag', 17) ]),
      el('div', { class:'mid' }, [
        el('div', { class:'t', text:entryTitle(e) }),
        el('div', { class:'s', text:entrySub(e) })
      ]),
      el('div', { class:'end' }, [
        U.moneyEl(t.amountMinor, t.currency, 'amt-sm amt--' + tone,
                  { plus: tone === 'in' }),
        (t.attachments && t.attachments.some(a => a.needsReview))
          ? el('div', { class:'chip chip--warn', text:'؟' }) : null
      ])
    ]);
    return row;
  }
  function viewTx(){
    const v = el('div', { class:'view' });
    v.appendChild(el('div', { class:'sec' }, [ el('h2', { text:T('tx.title') }) ]));
    const search = el('input', { class:'ctl', type:'search', id:'tx-search',
      placeholder:T('tx.search'), value:txFilter.q,
      oninput:(ev)=>{ txFilter.q = ev.target.value; renderList(); } });
    v.appendChild(search);
    const seg = el('div', { class:'pills' });
    [['all',T('common.all')],['expense',T('add.expense')],['income',T('add.income')],
     ['transfer',T('add.transfer')],['person',T('people.title')]].forEach(([k,l]) => {
      seg.appendChild(el('button', { class:'pill', 'aria-pressed': txFilter.type===k, text:l,
        onclick:()=>{ txFilter.type = k; render(); } }));
    });
    v.appendChild(seg);
    const holder = el('div');
    v.appendChild(holder);
    function renderList(){
      holder.textContent = '';
      const q = txFilter.q.trim().toLowerCase();
      let items = allEntries();
      if (txFilter.type === 'person') items = items.filter(e => e.kind === 'person');
      else if (txFilter.type !== 'all') items = items.filter(e => e.kind === 'tx' && e.t.type === txFilter.type);
      if (q) items = items.filter(e => (entryTitle(e) + ' ' + entrySub(e)).toLowerCase().includes(q));
      if (!items.length){ holder.appendChild(emptyBox(T('tx.none'), '', null)); return; }
      let day = null, list = null;
      items.slice(0, 300).forEach(e => {
        const d = String(e.t.occurredAt).slice(0,10);
        if (d !== day){
          day = d;
          holder.appendChild(el('div', { class:'sec', style:{marginTop:'10px'} },
            [ el('h2', { text:U.dateLong(e.t.occurredAt) }) ]));
          list = el('div', { class:'list' }); holder.appendChild(list);
        }
        list.appendChild(entryRow(e));
      });
      if (items.length > 300) holder.appendChild(el('p', { class:'note',
        text: I.lang==='ar' ? 'عُرضت أحدث ٣٠٠ عملية. استخدم البحث للوصول إلى الأقدم.'
            : I.lang==='tr' ? 'En yeni 300 işlem gösterildi. Daha eskiler için aramayı kullan.'
            : 'Showing the 300 most recent. Use search to reach older ones.' }));
    }
    renderList();
    return v;
  }
  function openEntry(e){
    const t = e.t;
    if (e.kind === 'person'){
      const per = perOf(t.personId);
      if (per) return ledgerEntrySheet(per, t);
    }
    U.sheet(entryTitle(e), U.dateLong(t.occurredAt) + ' · ' + U.timeShort(t.occurredAt), (b, close) => {
      const dl = el('dl', { class:'kv' });
      const add = (k, node) => { dl.appendChild(el('dt', { text:k })); dl.appendChild(el('dd', {}, [node])); };
      add(T('add.amount'), U.moneyEl(t.amountMinor, t.currency, 'amt-lg amt--' + entryTone(t)));
      if (t.currency !== base() && t.fx)
        add(base(), U.moneyEl(t.fx.baseAmountMinor, base(), 'amt-sm'));
      if (e.kind === 'tx'){
        if (t.categoryId) add(T('add.category'), document.createTextNode(catLabel(t.categoryId)));
        if (t.accountId) add(T('add.account'), document.createTextNode(nameOf(accOf(t.accountId)) || '—'));
        if (t.toAccountId) add(T('add.to'), document.createTextNode(nameOf(accOf(t.toAccountId)) || '—'));
        if (t.bookId){ const bk = S.byId(S.db.books, t.bookId); if (bk) add(T('add.book'), document.createTextNode(nameOf(bk))); }
      } else {
        add(T('people.title'), document.createTextNode((perOf(t.personId)||{}).name || t.personName || '—'));
      }
      const note = typeof t.note === 'string' ? t.note : S.localized(t.note, I.lang);
      if (note) add(T('add.note'), document.createTextNode(note));
      if (t.tags && t.tags.length) add('#', document.createTextNode(t.tags.join(' · ')));
      b.appendChild(dl);
      if (t.attachments && t.attachments.length){
        b.appendChild(el('div', { class:'warnbox', text:T('health.needsReview') + ': ' + t.attachments.length }));
      }
      b.appendChild(el('div', { class:'btnrow' }, [
        el('button', { class:'btn btn--danger', text:T('tx.delete'), onclick:()=>{
          close();
          U.confirmSheet(T('tx.confirmDelete'), entryTitle(e), T('tx.delete'), () => {
            const snap = e.kind === 'tx' ? S.removeTx(t.id) : S.removePersonTx(t.id);
            U.toast(T('tx.deleted'), T('tx.undo'), () => {
              if (e.kind === 'tx') S.restoreTx(snap);
              else { S.db.personTransactions.push(snap); S.persist(); render(); }
              render();
            });
            render();
          }, true);
        }}),
        el('button', { class:'btn', text:T('common.close'), onclick:close })
      ]));
    });
  }

  /* ================= التسجيل السريع ================= */
  function lastUsed(){
    const last = S.db.transactions.filter(t => t.type === 'expense')
      .sort((a,b) => Date.parse(b.createdAt||b.occurredAt) - Date.parse(a.createdAt||a.occurredAt))[0];
    return last || null;
  }
  function openAdd(preset){
    if (!S.db.accounts.length && !(preset && preset.allowNoAccount)){
      U.toast(T('add.errNoAccounts')); return;
    }
    const last = lastUsed();
    const st = Object.assign({
      type:'expense', amount:'', currency: base(),
      accountId: (last && last.accountId) || (S.db.accounts[0] && S.db.accounts[0].id) || null,
      toAccountId: null,
      categoryId: (last && last.categoryId) || null,
      bookId: (last && last.bookId) || (S.db.books[0] && S.db.books[0].id) || null,
      date: new Date().toISOString().slice(0,10), note:'',
      guessed: { account: !!(last && last.accountId), category: !!(last && last.categoryId) }
    }, preset || {});

    U.sheet(T('add.title'), T('add.guessedHelp'), (b, close) => {
      const seg = el('div', { class:'seg' });
      [['expense',T('add.expense')],['income',T('add.income')],['transfer',T('add.transfer')]].forEach(([k,l])=>{
        seg.appendChild(el('button', { 'data-k':k, 'aria-pressed': st.type===k, text:l,
          onclick:()=>{ st.type = k; close(); openAdd(Object.assign({}, st, { type:k, amount:amtIn.value })); } }));
      });
      b.appendChild(seg);

      const amtIn = el('input', { class:'ctl keypad-amt', id:'add-amount', inputmode:'decimal',
        placeholder:'0', value:st.amount, 'aria-label':T('add.amount') });
      const curSel = el('select', { class:'ctl', id:'add-currency', style:{maxWidth:'130px'} },
        S.db.currencies.map(c => el('option', { value:c.code, text:c.code + ' · ' + c.symbol,
          selected: c.code === st.currency })));
      b.appendChild(el('div', { class:'field' }, [
        el('label', { for:'add-amount', text:T('add.amount') }),
        el('div', { style:{ display:'flex', gap:'9px', alignItems:'center' } }, [ amtIn, curSel ])
      ]));

      const err = el('div', { class:'warnbox', hidden:true });
      b.appendChild(err);
      const showErr = (m) => { err.textContent = m; err.hidden = false; };

      if (st.type === 'transfer'){
        b.appendChild(el('p', { class:'note', text:T('add.transferHint') }));
        const from = accSelect('add-from', st.accountId);
        const to = accSelect('add-to', st.toAccountId);
        b.appendChild(el('div', { class:'field' }, [ el('label',{for:'add-from',text:T('add.from')}), from ]));
        b.appendChild(el('div', { class:'field' }, [ el('label',{for:'add-to',text:T('add.to')}), to ]));
        st.__from = from; st.__to = to;
      } else {
        const catWrap = el('div', { class:'pills' });
        const cats = S.db.categories.filter(c => !c.parentId && !c.archived &&
          (st.type === 'income' ? c.kind === 'income' : c.kind === 'expense'));
        if (!cats.length) catWrap.appendChild(el('span', { class:'note', text:T('add.pickCategory') }));
        cats.slice(0, 40).forEach(c => {
          catWrap.appendChild(el('button', { class:'pill', 'aria-pressed': st.categoryId===c.id,
            text:nameOf(c), onclick:(ev)=>{
              st.categoryId = c.id; st.guessed.category = false;
              catWrap.querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed','false'));
              ev.currentTarget.setAttribute('aria-pressed','true');
              gcChip.hidden = true;
            }}));
        });
        const gcChip = el('span', { class:'chip chip--guess', text:T('add.guessed'), hidden: !st.guessed.category });
        b.appendChild(el('div', { class:'field' }, [
          el('label', {}, [ document.createTextNode(T('add.category') + ' '), gcChip ]), catWrap ]));

        const acc = accSelect('add-account', st.accountId, true);
        const gaChip = el('span', { class:'chip chip--guess', text:T('add.guessed'), hidden: !st.guessed.account });
        acc.addEventListener('change', ()=>{ gaChip.hidden = true; });
        b.appendChild(el('div', { class:'field' }, [
          el('label', { for:'add-account' }, [ document.createTextNode(T('add.account') + ' '), gaChip ]), acc ]));
        st.__acc = acc;
      }

      const dateIn = el('input', { class:'ctl', type:'date', id:'add-date', value:st.date });
      b.appendChild(el('div', { class:'field' }, [ el('label',{for:'add-date',text:T('add.date')}), dateIn ]));
      const noteIn = el('input', { class:'ctl', id:'add-note', placeholder:T('add.notePh'), value:st.note });
      b.appendChild(el('div', { class:'field' }, [ el('label',{for:'add-note',text:T('add.note')}), noteIn ]));

      b.appendChild(el('button', { class:'btn btn--primary btn--wide', text:T('add.save'), onclick:()=>{
        const minor = S.M.fromInput(amtIn.value);
        if (minor <= 0) return showErr(T('add.errAmount'));
        const cur = curSel.value;
        const when = new Date(dateIn.value + 'T12:00:00').toISOString();
        if (st.type === 'transfer'){
          const a = st.__from.value, c = st.__to.value;
          if (!a || !c) return showErr(T('add.errSameAccount'));
          if (a === c) return showErr(T('add.errSameAccount'));
          S.addTx({ type:'transfer', accountId:a, toAccountId:c, currency:cur, amountMinor:minor,
                    occurredAt:when, note:noteIn.value || null });
        } else {
          if (!st.categoryId) return showErr(T('add.errCategory'));
          const accId = st.__acc ? (st.__acc.value || null) : null;
          S.addTx({ type:st.type, accountId:accId, categoryId:st.categoryId, bookId:st.bookId,
                    currency:cur, amountMinor:minor, occurredAt:when, note:noteIn.value || null });
        }
        close(); U.toast(T('add.saved')); render();
      }}));
    });
  }
  function accSelect(id, value, allowNone){
    const s = el('select', { class:'ctl', id });
    if (allowNone) s.appendChild(el('option', { value:'', text:T('add.noAccount') }));
    S.db.accounts.filter(a => !a.archived).forEach(a => s.appendChild(
      el('option', { value:a.id, text: nameOf(a) + ' · ' + a.currency, selected: a.id === value })));
    return s;
  }

  /* ================= الأشخاص ================= */
  /* ---------- صياغة الرصيد بالكلمات، لا بالإشارة ---------- */
  function netWords(otherName, netMinor, currency){
    if (!netMinor) return { text:T('ledger.settled'), tone:'ghost', amount:null };
    const amount = U.money(Math.abs(netMinor), currency);
    if (netMinor > 0) return { text:T('ledger.owedToOther', { other:otherName, amount }),
                               tone:'out', amount, dir:'owe' };
    return { text:T('ledger.owedToYou', { other:otherName, amount }), tone:'in', amount, dir:'owed' };
  }
  function netBlock(otherName, L){
    const wrap = el('div', { class:'answers' });
    const curs = L.currencies.length ? L.currencies : [base()];
    curs.forEach((c, i) => {
      const w = netWords(otherName, L.netByCur[c] || 0, c);
      wrap.appendChild(el('div', { class:'lead', style: i ? { borderTop:'1px solid var(--border)' } : null }, [
        el('div', { class:'k', text: T('ledger.net') + (curs.length > 1 ? ' · ' + c : '') }),
        el('div', { style:{ fontSize:'19px', fontWeight:'750', marginTop:'4px',
          color: w.tone === 'out' ? 'var(--expense)' : w.tone === 'in' ? 'var(--income)' : 'var(--muted)' },
          text:w.text }),
        el('div', { class:'sub' }, [
          document.createTextNode(T('people.withPerson') + ' '),
          U.moneyEl(L.holdingByCur[c] || 0, c, 'amt-sm'),
          document.createTextNode(' · ' + T('ledger.iTook') + ' '),
          U.moneyEl(L.debtByCur[c] || 0, c, 'amt-sm')
        ])
      ]));
    });
    if (curs.length > 1) wrap.appendChild(el('div', { class:'lead', style:{ borderTop:'1px solid var(--border)' } },
      [ el('div', { class:'sub', style:{margin:0}, text:T('ledger.perCurrency') }) ]));
    return wrap;
  }


  function personRow(p){
    const L = S.personLedger(p.id);
    const mainCur = L.currencies[0] || base();
    const w = netWords(p.name, L.netByCur[mainCur] || 0, mainCur);
    const pct = L.handed > 0 ? Math.max(0, Math.min(1, L.holding / L.handed)) : 0;
    return el('button', { class:'person', onclick:()=>go('person', p.id) }, [
      el('div', { class:'avatar', style:{ background: p.color || U.colorFor(p.name) },
                  text:U.initials(p.name) }),
      el('div', { class:'mid', style:{ flex:'1', minWidth:0 } }, [
        el('div', { class:'t' }, [ document.createTextNode(p.name),
          p.unlinkedAt ? el('span', { class:'chip chip--ghost', style:{marginInlineStart:'6px'},
            text:T('ledger.unlinked') }) : null,
          L.pending ? el('span', { class:'chip chip--warn', style:{marginInlineStart:'6px'},
            text:U.digits(L.pending) }) : null ]),
        el('div', { class:'meter' }, [ el('i', { style:{ width:(pct*100)+'%' } }) ]),
        el('div', { class:'s', style:{ marginTop:'5px',
          color: w.tone === 'out' ? 'var(--expense)' : w.tone === 'in' ? 'var(--income)' : 'var(--muted)' },
          text:w.text })
      ]),
      el('div', { class:'end' }, [
        U.moneyEl(L.holdingByCur[mainCur] || 0, mainCur, 'amt-lg amt--tr'),
        el('div', { class:'s', text:T('people.withPerson') })
      ])
    ]);
  }
  function viewPeople(){
    const v = el('div', { class:'view' });
    v.appendChild(el('div', { class:'sec' }, [
      el('h2', { text:T('people.title') }),
      el('button', { class:'more', text:T('people.add'), onclick:addPersonSheet })
    ]));
    const people = S.db.people.filter(p => !p.archived);
    if (!people.length){
      v.appendChild(emptyBox(T('home.emptyPeopleTitle'), T('home.emptyPeopleBody'),
        T('people.add'), addPersonSheet));
      return v;
    }
    const withMoney = people.map(p => ({ p, L:S.personLedger(p.id) }))
      .sort((a,b) => b.L.holding - a.L.holding);
    const total = withMoney.reduce((s,x) => s + Math.max(0,x.L.holding), 0);
    v.appendChild(el('div', { class:'answers' }, [ el('div', { class:'lead' }, [
      el('div', { class:'k', text:T('home.withOthers') }),
      U.moneyEl(total, base(), 'amt-xl amt--tr'),
      el('div', { class:'sub', text:T('people.handoverHelp') })
    ])]));
    const list = el('div', { class:'list' });
    withMoney.forEach(x => list.appendChild(personRow(x.p)));
    v.appendChild(list);
    return v;
  }
  function addPersonSheet(){
    U.sheet(T('people.add'), T('people.inviteHelp'), (b, close) => {
      const nm = el('input', { class:'ctl', id:'p-name', placeholder:T('people.name') });
      const lg = el('select', { class:'ctl', id:'p-lang' },
        I.list().map(([k,l]) => el('option', { value:k, text:l, selected:k===I.lang })));
      b.appendChild(el('div', { class:'field' }, [ el('label',{for:'p-name',text:T('people.name')}), nm ]));
      b.appendChild(el('div', { class:'field' }, [ el('label',{for:'p-lang',text:T('people.lang')}), lg ]));

  function ledgerRow(person, r){
    const label = T('ledger.types.' + r.type) || r.type;
    const reversed = !!r.reversedByEntryId;
    const isRev = r.type === 'reversal';
    const tone = (r.type === 'purchase' || r.type === 'repay') ? 'out'
               : (r.type === 'return' || r.type === 'borrow') ? 'in' : 'tr';
    const note = typeof r.note === 'string' ? r.note : S.localized(r.note, I.lang);
    const who = r.createdByName || (r.createdBy && w.Cloud && w.Cloud.session &&
                r.createdBy === w.Cloud.session.userId ? null : person.name);
    const bits = [U.dateShort(r.occurredAt)];
    if (note) bits.push(note);
    if (who) bits.push(T('ledger.by', { name:who }));
    if (r.reason) bits.push(r.reason);
    return el('button', { class:'row', style: reversed ? { opacity:'.55' } : null,
      onclick:()=>ledgerEntrySheet(person, r) }, [
      el('div', { class:'ico', style:{ background: isRev ? 'var(--muted)'
        : tone === 'out' ? 'var(--expense)' : tone === 'in' ? 'var(--income)' : 'var(--primary)' } },
        [U.icon(isRev ? 'x' : r.type === 'purchase' ? 'bag' : r.type === 'borrow' ? 'download' : 'hand', 16)]),
      el('div', { class:'mid' }, [
        el('div', { class:'t' }, [ document.createTextNode(label),
          reversed ? el('span', { class:'chip chip--ghost', style:{marginInlineStart:'6px'},
            text:T('ledger.reversed') }) : null,
          (!r.confirmedAt && r.requiresConfirmation && !isRev)
            ? el('span', { class:'chip chip--warn', style:{marginInlineStart:'6px'},
                text:T('ledger.needsConfirm') }) : null ]),
        el('div', { class:'s', text:bits.join(' · ') })
      ]),
      el('div', { class:'end' }, [
        U.moneyEl(r.amountMinor, r.currency, 'amt-sm amt--' + tone,
                  { plus: tone === 'in' })
      ])
    ]);
  }
  function ledgerEntrySheet(person, r){
    const label = T('ledger.types.' + r.type) || r.type;
    U.sheet(label + ' · ' + person.name,
            U.dateLong(r.occurredAt) + ' · ' + U.timeShort(r.occurredAt), (b, close) => {
      const dl = el('dl', { class:'kv' });
      const add = (k, node) => { dl.appendChild(el('dt', { text:k })); dl.appendChild(el('dd', {}, [node])); };
      add(T('add.amount'), U.moneyEl(r.amountMinor, r.currency, 'amt-lg'));
      const note = typeof r.note === 'string' ? r.note : S.localized(r.note, I.lang);
      if (note) add(T('add.note'), document.createTextNode(note));
      if (r.createdByName) add(T('ledger.by', { name:'' }).replace('{name}','').trim() || '—',
                               document.createTextNode(r.createdByName));
      if (r.reason) add(T('ledger.reverseReason'), document.createTextNode(r.reason));
      if (r.requiresConfirmation || r.confirmedAt)
        add(T('ledger.confirmed'), document.createTextNode(
          r.confirmedAt ? U.dateShort(r.confirmedAt) : T('ledger.needsConfirm')));
      b.appendChild(dl);
      if (r.reversedByEntryId) b.appendChild(el('div', { class:'warnbox', text:T('ledger.reversed') }));
      const row = el('div', { class:'btnrow' });
      const myUid = (w.Cloud && w.Cloud.session) ? w.Cloud.session.userId : null;
      const mineEntry = !r.createdBy || (myUid && r.createdBy === myUid);
      if (r.requiresConfirmation && !r.confirmedAt && !mineEntry && !r.reversedByEntryId
          && w.Cloud && w.Cloud.configured()){
        row.appendChild(el('button', { class:'btn btn--primary', text:T('ledger.confirm'), onclick:()=>{
          w.Cloud.confirmEntry(r.id).then(()=> w.Cloud.pullChanges())
            .then(()=>{ close(); U.toast(T('ledger.confirmed')); render(); })
            .catch(e => U.toast(String(e.message || e)));
        }}));
      }
      if (!r.reversedByEntryId && r.type !== 'reversal' && !person.unlinkedAt){
        row.appendChild(el('button', { class:'btn btn--danger', text:T('ledger.reverse'), onclick:()=>{
          close(); reverseSheet(person, r);
        }}));
      }
      row.appendChild(el('button', { class:'btn', text:T('common.close'), onclick:close }));
      b.appendChild(row);
    });
  }

  function settleSheet(person, L){
    U.sheet(T('ledger.settle') + ' · ' + person.name, T('ledger.settleBody'), (b, close) => {
      L.currencies.forEach(c => {
        const w2 = netWords(person.name, L.netByCur[c] || 0, c);

          el('div', { class:'t', text: c + ' — ' + w2.text }) ]));

          text:T('ledger.settle') + ' · ' + c, onclick:()=>{
            const local = () => {
              const h = L.holdingByCur[c] || 0, d = L.debtByCur[c] || 0;
              if (h) S.addPersonTx({ type:'settle', personId:person.id, currency:c,
                amountMinor:Math.abs(h), settleAxis:'holding', reason:T('ledger.settle'),
                confirmedAt:new Date().toISOString(), occurredAt:new Date().toISOString() });

                confirmedAt:new Date().toISOString(), occurredAt:new Date().toISOString() });
              close(); U.toast(T('ledger.settled')); render();

            if (w.Cloud && w.Cloud.configured() && w.Cloud.meta.role === 'owner')
              w.Cloud.settlePerson(person.id, c).then(()=> w.Cloud.pullChanges())
                .then(()=>{ close(); U.toast(T('ledger.settled')); render(); })
                .catch(()=> local());
            else local();
          }}));

  function personEntrySheet(p, type){
    const L = S.personLedger(p.id);
    const help = { handover:T('people.handoverHelp'), purchase:T('people.purchaseHelp'),
                   return:T('people.returnHelp'),
                   borrow:T('ledger.owedToOther', { other:p.name, amount:'…' }),
                   repay:T('ledger.iRepaid') }[type];
    const title = { handover:T('people.handover'), purchase:T('people.purchase'),
                    return:T('people.return'), borrow:T('ledger.iTookFrom', { other:p.name }),
                    repay:T('ledger.iRepaid') }[type];
    U.sheet(title + ' · ' + p.name, help, (b, close) => {
      const amt = el('input', { class:'ctl keypad-amt', id:'pe-amt', inputmode:'decimal', placeholder:'0' });
      const cur = el('select', { class:'ctl', id:'pe-cur', style:{maxWidth:'130px'} },
        S.db.currencies.map(c => el('option', { value:c.code, text:c.code, selected:c.code===base() })));
      b.appendChild(el('div', { class:'field' }, [
        el('label', { for:'pe-amt', text:T('add.amount') }),
        el('div', { style:{display:'flex',gap:'9px',alignItems:'center'} }, [amt, cur]) ]));
      if (type !== 'purchase'){
        const acc = accSelect('pe-acc', (S.db.accounts[0]||{}).id, true);
        const lbl = (type === 'handover' || type === 'repay') ? T('people.fromAccount') : T('people.toAccount');
        b.appendChild(el('div', { class:'field' }, [ el('label', { for:'pe-acc', text:lbl }), acc ]));
        b.__acc = acc;
      }
      let catSel = null;
      if (type === 'purchase'){
        catSel = el('select', { class:'ctl', id:'pe-cat' },
          [el('option', { value:'', text:T('add.pickCategory') })].concat(
            S.db.categories.filter(c => !c.parentId && c.kind === 'expense' && !c.archived)
              .map(c => el('option', { value:c.id, text:nameOf(c) }))));
        b.appendChild(el('div', { class:'field' }, [ el('label',{for:'pe-cat',text:T('add.category')}), catSel ]));
      }
      const desc = el('input', { class:'ctl', id:'pe-desc',
        placeholder: type==='purchase' ? T('people.whatBoughtPh') : T('add.notePh') });
      b.appendChild(el('div', { class:'field' }, [
        el('label', { for:'pe-desc', text: type==='purchase' ? T('people.whatBought') : T('add.note') }), desc ]));

      let receipt = null, unclear = null;
      if (type === 'purchase'){
        const file = el('input', { type:'file', accept:'image/*', id:'pe-file', class:'ctl' });
        unclear = el('input', { type:'checkbox', id:'pe-unclear' });
        file.addEventListener('change', ()=>{ receipt = file.files && file.files[0] ? file.files[0].name : null; });
        b.appendChild(el('div', { class:'field' }, [
          el('label', { for:'pe-file', text:T('people.attachReceipt') }), file,
          el('label', { for:'pe-unclear', style:{display:'flex',gap:'8px',alignItems:'center',fontWeight:'600'} },
            [unclear, document.createTextNode(T('people.receiptUnclear'))]) ]));
      }
      const dt = el('input', { class:'ctl', type:'date', id:'pe-date',
        value:new Date().toISOString().slice(0,10) });
      b.appendChild(el('div', { class:'field' }, [ el('label',{for:'pe-date',text:T('add.date')}), dt ]));
      const err = el('div', { class:'warnbox', hidden:true }); b.appendChild(err);
      const showErr = m => { err.textContent = m; err.hidden = false; };

      b.appendChild(el('button', { class:'btn btn--primary btn--wide', text:T('common.save'), onclick:()=>{
        const minor = S.M.fromInput(amt.value);
        if (minor <= 0) return showErr(T('add.errAmount'));
        const c = cur.value;
        const holdingInCur = (L.holdingByCur[c] != null) ? L.holdingByCur[c] : L.holding;
        if (type === 'purchase'){
          if (!catSel.value) return showErr(T('add.errCategory'));
          if (unclear && unclear.checked && !desc.value.trim()) return showErr(T('people.describeFirst'));
          if (receipt && !desc.value.trim() && unclear && unclear.checked) return showErr(T('people.describeFirst'));
          if (minor > holdingInCur) return showErr(T('people.errOverspend', { left:U.money(holdingInCur, c) }));
        }
        if (type === 'return' && minor > holdingInCur)
          return showErr(T('people.errReturnTooMuch', { left:U.money(holdingInCur, c) }));
        if (type === 'repay'){
          const owed = (L.debtByCur[c] != null) ? L.debtByCur[c] : L.debt;
          if (minor > owed) return showErr(T('people.errReturnTooMuch', { left:U.money(owed, c) }));
        }
        const when = new Date(dt.value + 'T12:00:00').toISOString();
        S.addPersonTx({
          type, personId:p.id, currency:c, amountMinor:minor, occurredAt:when,
          accountId: (type !== 'purchase' && b.__acc) ? (b.__acc.value || null) : null,
          categoryId: catSel ? catSel.value : null,
          note: desc.value.trim() || null,
          attachments: receipt ? [{ id:S.uid('att'), file:receipt,
            needsReview: !!(unclear && unclear.checked), description: desc.value.trim() || null }] : []
        });
        close(); U.toast(T('add.saved')); render();
      }}));
    });
  }

  /* ================= التقارير ================= */
  let reportPeriod = 'thisMonth';
  function periodRange(){
    const n = new Date();
    if (reportPeriod === 'thisMonth') return S.monthRange(n);
    if (reportPeriod === 'lastMonth') return S.monthRange(new Date(n.getFullYear(), n.getMonth()-1, 1));
    if (reportPeriod === 'thisYear') return [new Date(n.getFullYear(),0,1).getTime(),
                                             new Date(n.getFullYear()+1,0,1).getTime()];
    return [-8640000000000, 8640000000000];
  }
  function viewReports(){
    const v = el('div', { class:'view' });
    v.appendChild(el('div', { class:'sec' }, [ el('h2', { text:T('reports.title') }) ]));
    const pills = el('div', { class:'pills' });
    [['thisMonth',T('reports.thisMonth')],['lastMonth',T('reports.lastMonth')],
     ['thisYear',T('reports.thisYear')],['all',T('reports.all')]].forEach(([k,l])=>{
      pills.appendChild(el('button', { class:'pill', 'aria-pressed': reportPeriod===k, text:l,
        onclick:()=>{ reportPeriod = k; render(); } }));
    });
    v.appendChild(pills);
    const [from,to] = periodRange();
    const inc = S.incomeBetween(from,to), exp = S.spentBetween(from,to);
    v.appendChild(el('div', { class:'answers' }, [ el('div', { class:'grid' }, [
      el('div', {}, [ el('div',{class:'k',text:T('reports.income')}), U.moneyEl(inc, base(),'amt--in v') ]),
      el('div', {}, [ el('div',{class:'k',text:T('reports.expense')}), U.moneyEl(exp, base(),'amt--out v') ]),
      el('div', {}, [ el('div',{class:'k',text:T('reports.net')}),
        U.moneyEl(inc-exp, base(), (inc-exp>=0?'amt--in':'amt--out')+' v') ])
    ])]));
    v.appendChild(el('p', { class:'note', text:T('reports.mixedCurrency', { cur:U.symbolOf(base()) }) }));

    /* حسب التصنيف */
    v.appendChild(sectionHead(T('reports.byCategory')));
    const ents = S.spendingEntries().filter(e => e.at >= from && e.at < to);
    if (!ents.length) v.appendChild(emptyBox(T('reports.noData'),'',null));
    else {
      const agg = {};
      ents.forEach(e => {
        const c = catOf(e.categoryId);
        const rootId = c ? (c.parentId || c.id) : '__none';
        agg[rootId] = (agg[rootId]||0) + e.base;
      });
      const rows = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
      const max = rows[0][1] || 1, total = rows.reduce((s,r)=>s+r[1],0);
      const bars = el('div', { class:'bars', style:{ background:'var(--surface)', border:'1px solid var(--border)',
        borderRadius:'var(--r-lg)', padding:'14px' } });
      rows.slice(0,14).forEach(([id,val]) => {
        const c = catOf(id);
        bars.appendChild(el('div', { class:'bar' }, [
          el('div', { class:'nm', text: c ? nameOf(c) : T('common.none') }),
          el('div', { class:'tr' }, [ el('div', { class:'fl',
            style:{ width:Math.max(3,(val/max)*100)+'%', background:(c&&c.color)||'var(--primary)' } }) ]),
          el('div', { class:'vl' }, [ U.moneyEl(val, base(), 'amt-sm'),
            el('div', { class:'s', style:{fontSize:'11px',color:'var(--muted)',textAlign:'end'},
              text: U.digits(Math.round(val/total*100)) + '% ' + T('reports.ofTotal') }) ])
        ]));
      });
      v.appendChild(bars);
    }

    /* حسب الشهر */
    v.appendChild(sectionHead(T('reports.byMonth')));
    const byMonth = {};
    S.spendingEntries().forEach(e => {
      const k = new Date(e.at).toISOString().slice(0,7);
      byMonth[k] = (byMonth[k]||0) + e.base;
    });
    const months = Object.entries(byMonth).sort((a,b)=>a[0]<b[0]?-1:1).slice(-12);
    if (months.length) v.appendChild(sparkCard(months));

    /* حسب الشخص */
    const people = S.db.people.filter(p => !p.archived);
    if (people.length){
      v.appendChild(sectionHead(T('reports.byPerson')));
      const wrap = el('div', { class:'tablewrap list', style:{padding:'4px 10px'} });
      const tb = el('table');

  function sparkCard(months){
    const ns='http://www.w3.org/2000/svg';
    const W=320, H=64, pad=6;
    const vals = months.map(m=>m[1]); const max = Math.max.apply(null, vals) || 1;
    const step = months.length > 1 ? (W - pad*2)/(months.length-1) : 0;
    const pts = vals.map((val,i) => [pad + i*step, H - pad - (val/max)*(H - pad*2)]);
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class','spark');
    svg.setAttribute('preserveAspectRatio','none'); svg.setAttribute('aria-hidden','true');
    const area = document.createElementNS(ns,'path');
    area.setAttribute('d', 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')
      + ' L '+(pad+(months.length-1)*step).toFixed(1)+' '+(H-pad)+' L '+pad+' '+(H-pad)+' Z');
    area.setAttribute('fill','var(--primary-soft)');
    const line = document.createElementNS(ns,'path');
    line.setAttribute('d', 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L '));
    line.setAttribute('fill','none'); line.setAttribute('stroke','var(--primary)'); line.setAttribute('stroke-width','2');
    const last = document.createElementNS(ns,'circle');
    last.setAttribute('cx', pts[pts.length-1][0]); last.setAttribute('cy', pts[pts.length-1][1]);
    last.setAttribute('r','3.2'); last.setAttribute('fill','var(--primary)');
    svg.appendChild(area); svg.appendChild(line); svg.appendChild(last);
    return el('div', { class:'list', style:{padding:'14px'} }, [
      svg,
      el('div', { style:{ display:'flex', justifyContent:'space-between', marginTop:'6px' } }, [
        el('span', { class:'note', text:U.digits(months[0][0]) }),
        el('span', { class:'note' }, [ U.moneyEl(months[months.length-1][1], base(), 'amt-sm') ]),
        el('span', { class:'note', text:U.digits(months[months.length-1][0]) })
      ])
    ]);
  }

  function parseCsv(text){
    const rows = []; let row = [], cur = '', q = false;
    for (let i=0;i<text.length;i++){
      const ch = text[i];
      if (q){
        if (ch === '"' && text[i+1] === '"'){ cur += '"'; i++; }
        else if (ch === '"') q = false; else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',' || ch === ';' || ch === '\t'){ row.push(cur); cur=''; }
      else if (ch === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if (ch !== '\r') cur += ch;
    }
    if (cur.length || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }

      b.appendChild(el('p', { class:'note', text: I.lang==='ar'
        ? 'ملفات XLSX: صدّرها من إكسل بصيغة CSV أولًا — الاستيراد هنا يقرأ CSV نصيًا بلا مكتبات خارجية.'
        : I.lang==='tr' ? 'XLSX için önce Excel’den CSV olarak kaydet.'
        : 'For XLSX, save it as CSV from Excel first.' }));

  function mapStage(stage, rows, close){
    stage.textContent = '';
    if (rows.length < 2){ stage.appendChild(el('div',{class:'warnbox',text:T('io.fileErr')})); return; }
    const header = rows[0].map(h => String(h).trim());
    const guess = (names) => { const i = header.findIndex(h => names.some(n => h.toLowerCase().includes(n))); return i; };
    const map = { date:guess(['date','tarih','تاريخ']), amount:guess(['amount','price','tutar','مبلغ']),
                  currency:guess(['currency','para','عمل']), category:guess(['categ','kategori','تصنيف','فئة']),
                  account:guess(['account','hesap','حساب']), note:guess(['note','desc','not','ملاحظ']),
                  type:guess(['type','transaction','tür','نوع']) };
    const fields = [['date',T('io.colDate')],['amount',T('io.colAmount')],['currency',T('io.colCurrency')],
                    ['category',T('io.colCategory')],['account',T('io.colAccount')],['note',T('io.colNote')],
                    ['type',T('io.colType')]];
    fields.forEach(([k,label]) => {
      const sel = el('select', { class:'ctl', id:'map-'+k }, [el('option',{value:'-1',text:T('io.colIgnore')})]
        .concat(header.map((h,i)=>el('option',{value:String(i),text:h||('#'+(i+1)),selected:map[k]===i}))));
      sel.addEventListener('change', ()=>{ map[k] = parseInt(sel.value,10); refresh(); });
      stage.appendChild(el('div',{class:'field'},[el('label',{for:'map-'+k,text:label}),sel]));
    });
    const out = el('div'); stage.appendChild(out);
    function build(){
      return rows.slice(1).map((r,idx) => {
        const get = k => map[k] >= 0 ? String(r[map[k]] ?? '').trim() : '';
        const rawDate = get('date'), rawAmt = get('amount');
        if (!rawDate || !rawAmt) return { __error:true, __why:'missing', __row:idx+2 };
        const d = new Date(rawDate.replace(/\./g,'-').replace(/\//g,'-'));
        if (isNaN(d.getTime())) return { __error:true, __why:'date', __row:idx+2 };
        const minor = S.M.fromInput(rawAmt);
        if (!minor) return { __error:true, __why:'amount', __row:idx+2 };
        const typeRaw = get('type').toLowerCase();
        const isIncome = /income|gelir|دخل|\+/.test(typeRaw) || (minor > 0 && /income/.test(typeRaw));
        const curCode = (get('currency') || base()).toUpperCase().slice(0,3);
        const catName = get('category');
        let cat = S.db.categories.find(c => !c.parentId && nameOf(c).toLowerCase() === catName.toLowerCase());
        return {
          type: isIncome ? 'income' : 'expense',
          occurredAt: d.toISOString(),
          amountMinor: Math.abs(minor),
          currency: S.db.currencies.some(c=>c.code===curCode) ? curCode : base(),
          categoryId: cat ? cat.id : null,
          accountId: (S.db.accounts.find(a => nameOf(a).toLowerCase() === get('account').toLowerCase())||{}).id || null,
          note: get('note') || null,
          __newCategoryName: cat ? null : (catName || null),
          source: { app:'csv', uid: [rawDate, rawAmt, catName, get('note')].join('|') }
        };
      });
    }
    function refresh(){
      out.textContent = '';
      if (map.date < 0 || map.amount < 0){ out.appendChild(el('div',{class:'warnbox',text:T('io.needDateAmount')})); return; }
      const classified = S.classifyRows(build());
      const tally = { new:0, duplicate:0, conflict:0, error:0 };
      classified.forEach(r => tally[r.__class]++);
      out.appendChild(el('div', { class:'answers' }, [ el('div', { class:'grid' }, [
        el('div',{},[el('div',{class:'k',text:T('io.newRows')}), el('div',{class:'amt v',text:U.digits(tally.new)})]),
        el('div',{},[el('div',{class:'k',text:T('io.dupRows')}), el('div',{class:'amt v',text:U.digits(tally.duplicate)})]),
        el('div',{},[el('div',{class:'k',text:T('io.conflictRows')}), el('div',{class:'amt v',text:U.digits(tally.conflict)})])
      ])]));
      if (tally.error) out.appendChild(el('div',{class:'warnbox',
        text:T('io.errorRows') + ': ' + U.digits(tally.error)}));
      const prev = el('div', { class:'list' });
      classified.slice(0,8).forEach(r => {
        if (r.__error){ prev.appendChild(el('div',{class:'row'},[
          el('div',{class:'ico',style:{background:'var(--expense)'}},[U.icon('alert',15)]),
          el('div',{class:'mid'},[el('div',{class:'t',text:'#'+r.__row}),el('div',{class:'s',text:r.__why})])])); return; }
        prev.appendChild(el('div',{class:'row'},[
          el('div',{class:'ico',style:{background: r.__class==='new' ? 'var(--income)' :
            r.__class==='duplicate' ? 'var(--muted)' : 'var(--warn)'}},[U.icon(r.__class==='new'?'check':'alert',15)]),
          el('div',{class:'mid'},[ el('div',{class:'t',text: r.__newCategoryName || catLabel(r.categoryId)}),
            el('div',{class:'s',text: U.dateShort(r.occurredAt) + ' · ' + (r.note||'')}) ]),
          el('div',{class:'end'},[U.moneyEl(r.amountMinor, r.currency, 'amt-sm')])
        ]));
      });
      out.appendChild(el('div',{class:'sec'},[el('h2',{text:T('io.preview')})]));
      out.appendChild(prev);
      out.appendChild(el('button', { class:'btn btn--primary btn--wide',
        text:T('io.confirmImport', { n:U.digits(tally.new + tally.conflict) }), onclick:()=>{
          classified.forEach(r => { if (r.__newCategoryName && !r.categoryId && r.__class !== 'duplicate'){
            const c = S.addCategory({ name:r.__newCategoryName, kind:r.type==='income'?'income':'expense',
              color:U.colorFor(r.__newCategoryName) });
            r.categoryId = c.id; }
            delete r.__newCategoryName; });
          const n = S.commitRows(classified);
          U.closeSheet(); U.toast(T('io.imported', { n:U.digits(n), d:U.digits(tally.duplicate) })); render();
        }}));
    }
    refresh();
  }

  function csvEscape(v){

    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;

  function exportTxCsv(){

    allEntries().forEach(e => {
      const t = e.t;
      const note = typeof t.note === 'string' ? t.note : S.localized(t.note, I.lang);
      lines.push([ t.id, t.type, String(t.occurredAt).slice(0,10), U.timeShort(t.occurredAt),
        t.currency, (t.amountMinor/100).toFixed(2), base(),
        ((t.fx && t.fx.baseAmountMinor || 0)/100).toFixed(2),
        t.bookId ? nameOf(S.byId(S.db.books,t.bookId)) : '',
        e.kind === 'tx' ? (t.categoryId ? nameOf(catOf(t.categoryId)) : '') : (t.categoryId?nameOf(catOf(t.categoryId)):''),
        (e.kind==='tx' && t.subcategoryId) ? nameOf(catOf(t.subcategoryId)) : '',
        t.accountId ? nameOf(accOf(t.accountId)) : '',
        t.toAccountId ? nameOf(accOf(t.toAccountId)) : '',
        t.personId ? ((perOf(t.personId)||{}).name || '') : '',
        note, (t.tags||[]).join(' '), (t.source && t.source.uid) || ''
      ].map(csvEscape).join(','));

    U.offerFile('raseedo-transactions.csv', '﻿' + lines.join('\n'), 'text/csv');

  function exportReportCsv(from,to){
    const ents = S.spendingEntries().filter(e => e.at>=from && e.at<to);
    const agg = {};
    ents.forEach(e => { const c = catOf(e.categoryId); const k = c ? (c.parentId||c.id) : '__none';
      agg[k] = (agg[k]||0)+e.base; });
    const lines = [[T('add.category'), T('reports.expense')+' ('+base()+')'].map(csvEscape).join(',')];
    Object.entries(agg).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => {
      const c = catOf(k); lines.push([ c?nameOf(c):T('common.none'), (v/100).toFixed(2) ].map(csvEscape).join(','));
    });
    lines.push([T('common.total'), (Object.values(agg).reduce((s,x)=>s+x,0)/100).toFixed(2)].map(csvEscape).join(','));
    U.offerFile('raseedo-report.csv', '﻿' + lines.join('\n'), 'text/csv');

  /* ================= وضع الضيف: الدفتر بينكما، ولا شيء غيره ================= */
  let guest = null;

  function guestBalances(){
    const out = {};
    (guest.balances || []).forEach(b => { out[b.currency] = {
      holding:Number(b.holding)||0, debt:Number(b.debt)||0, net:Number(b.net)||0 }; });
    if (!Object.keys(out).length){
      const agg = {};
      (guest.entries || []).forEach(e => {
        const c = e.currency || guest.baseCurrency, a = Number(e.amountMinor)||0;
        agg[c] = agg[c] || { holding:0, debt:0, net:0 };
        if (e.reversedBy || e.type === 'reversal') return;
        if (e.requiresConfirmation && !e.confirmedAt) return;
        if (e.type === 'handover') agg[c].holding += a;
        else if (e.type === 'purchase' || e.type === 'return') agg[c].holding -= a;
        else if (e.type === 'borrow') agg[c].debt += a;
        else if (e.type === 'repay') agg[c].debt -= a;
        else if (e.type === 'settle'){
          if (e.settleAxis === 'debt') agg[c].debt -= a; else agg[c].holding -= a;
        }
      });
      for (const c in agg){ agg[c].net = agg[c].debt - agg[c].holding; out[c] = agg[c]; }
    }
    return out;
  }

      case 'people': return viewPeople();
      case 'person': return viewPerson(route.param);
      case 'reports': return viewReports();
      case 'more': return viewMore();
      case 'settings': return viewSettings();
      case 'accounts': return viewAccounts();
      case 'categories': return viewCategories();
      case 'budgets': return viewBudgets();
      case 'io': return viewIO();
      case 'health': return viewHealth();
      case 'cloud': return viewCloud();
      case 'about': return viewAbout();
      case 'tx': return viewTx();
      default: return viewHome();
    }
  }
  function render(){
    const root = document.getElementById('app');
    root.textContent = '';
    root.appendChild(topbar());
    const main = el('main'); main.appendChild(currentView()); root.appendChild(main);
    root.appendChild(tabbar());
    const old = document.querySelector('.fab'); if (old) old.remove();
  }

  function loadDemo(force){
    const d = w.RASEEDO_DEMO;
    if (!d) return false;
    const copy = JSON.parse(JSON.stringify(d));
    copy.demo = true;
    if (force || !S.db.transactions.length){ S.set(copy); return true; }
    return false;
  }

  function boot(){
    const had = S.load();
    applyLang(); applyTheme();
    const head = document.head;
    const add = (tag, attrs) => { const n = document.createElement(tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]); head.appendChild(n); };
    const ASSET = (w.RASEEDO_ASSET_BASE || 'assets/');
    add('link', { rel:'apple-touch-icon', href:ASSET + 'apple-touch-icon.png' });
    add('link', { rel:'icon', href:ASSET + 'icon-192.png' });
    add('meta', { name:'apple-mobile-web-app-capable', content:'yes' });
    add('meta', { name:'mobile-web-app-capable', content:'yes' });
    add('meta', { name:'apple-mobile-web-app-title', content:'Raseedo' });
    add('meta', { name:'apple-mobile-web-app-status-bar-style', content:'default' });
    add('meta', { name:'theme-color', content:'#5351EB' });

    const conf = w.RASEEDO_CLOUD;
    if (conf && conf.url && conf.key && w.Cloud){
      w.Cloud.configure(conf);
      w.Cloud.subscribe(() => {
        const bar = document.querySelector('.topbar');
        if (bar && w.Cloud.meta.role !== 'person'){
          const old = bar.querySelector('.chip'); const fresh = syncChip();
          if (old && fresh) bar.replaceChild(fresh, old);
        }
      });
      const m = /[#&]join=([^&]+)/.exec(location.hash || '');
      const mo = /[#&]owner=([^&]+)/.exec(location.hash || '');
      const start = () => {
        w.Cloud.detectRole().then(() => {
          if (w.Cloud.meta.role === 'person'){
            return w.Cloud.personView().then(pv => {
              guest = pv;
              if (pv && pv.locale) { S.setSettings({ language: pv.locale }); applyLang(); }
              renderGuest();
            });
          }
          if (w.Cloud.meta.role === 'owner'){
            if (S.db.demo) clearDemoBeforeLink();
            render();
            return w.Cloud.pullChanges().then(()=>{ render(); w.Cloud.sync(); })
                   .catch(()=>{ render(); });
          }
          if (!had || !S.db.transactions.length) loadDemo(false);
          render();
        }).catch(() => { if (!had || !S.db.transactions.length) loadDemo(false); render(); });
      };
      if (m){
        history.replaceState(null, '', location.pathname);
        w.Cloud.ensureSession()
          .then(() => w.Cloud.claimPerson(decodeURIComponent(m[1])))
          .then(() => start())
          .catch(() => { U.toast(T('guest.joinErr')); start(); });
      } else if (mo){
        history.replaceState(null, '', location.pathname);
        w.Cloud.ensureSession()
          .then(() => { clearDemoBeforeLink();
                        return w.Cloud.rpc('claim_owner', { p_token: decodeURIComponent(mo[1]) }); })
          .then(r => { w.Cloud.meta.householdId = r.householdId; w.Cloud.meta.role = 'owner';
                       return w.Cloud.pullChanges(); })
          .then(() => start())
          .catch(() => { U.toast(T('cloud.badCode')); start(); });
      } else start();
      if ('serviceWorker' in navigator){
        try {
          navigator.serviceWorker.register('sw.js', { scope:'./', updateViaCache:'none' })
            .then(reg => {
              reg.update().catch(()=>{});
              setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
            }).catch(()=>{});
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return; reloaded = true; location.reload();
          });
        } catch(e){}
      }
      return;
    }
    if (!had || !S.db.transactions.length) loadDemo(false);
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  w.Raseedo = { go, render, openAdd, renderGuest, get guest(){ return guest; },
    setGuest(g){ guest = g; } };
})(window);
</script>
</body>
</html>
